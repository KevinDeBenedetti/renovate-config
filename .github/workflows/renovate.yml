name: Renovate

# Dependency updates of this repository, by Renovate, through the shared
# renovate.yml of github-workflows, with a token of the release GitHub App
# (variable RELEASE_APP_CLIENT_ID, secret RELEASE_APP_PRIVATE_KEY): its pull
# requests run CI like any other. renovate.json, at the root, extends the
# preset this repository publishes.
#
# Every day: the Monday run, inside the preset's Monday-morning schedule, opens
# the week's pull requests; the others keep them and the Dependency Dashboard
# current. A manual run is a dry run unless its box is unticked.
on:
  schedule:
    # 01:17 UTC: inside the Monday-morning schedule (before 6am Paris time),
    # with room for GitHub to start a scheduled run late.
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Look the updates up and log them, change nothing on GitHub
        type: boolean
        default: true

permissions: {}

jobs:
  renovate:
    # Pinned to a github-workflows release by full commit SHA, never @main.
    uses: KevinDeBenedetti/github-workflows/.github/workflows/renovate.yml@c3b092e3b28e798521c4506f033870f12dcbafdd # v0.56.2
    permissions: {} # Renovate works with the App's token, not with this job's
    with:
      app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
      # False on a schedule, where there are no inputs.
      dry-run: ${{ inputs.dry-run == true }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
