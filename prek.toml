# prek.toml — https://prek.j178.dev
# install: brew install j178/tap/prek && prek install
# run:     prek run --all-files

minimum_prek_version = "0.3.0"
fail_fast = false
default_install_hook_types = ["pre-commit"]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
# renovate: datasource=github-tags depName=pre-commit/pre-commit-hooks
rev = "v6.0.0"
hooks = [
  { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"] },
  { id = "end-of-file-fixer" },
  { id = "check-yaml" },
  { id = "check-json" },
  { id = "check-merge-conflict" },
  { id = "detect-private-key" },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
]

[[repos]]
repo = "https://github.com/rhysd/actionlint"
# renovate: datasource=github-tags depName=rhysd/actionlint
rev = "v1.7.12"
hooks = [
  { id = "actionlint" },
]

# The hook's own pattern only matches renovate.json and its variants: here it
# checks default.json too. Both are repository config, not self-hosted global
# config (--no-global), and an option that needs a migration fails the check
# (--strict).
[[repos]]
repo = "https://github.com/renovatebot/pre-commit-hooks"
# renovate: datasource=github-tags depName=renovatebot/pre-commit-hooks
rev = "44.257.5"
hooks = [
  { id = "renovate-config-validator", args = ["--strict", "--no-global"], files = "^(default|renovate)\\.json$" },
]
